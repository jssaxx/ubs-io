name: 💬 Request for Comments
description: 重大变更的 RFC（Request for Comments），用于在实现前征求社区反馈
title: "[RFC]: "
labels: ["rfc"]

body:
- type: markdown
  attributes:
    value: |
      **提交 RFC 之前，请先检索仓库内是否已有相同或相关的 RFC/Issue，如已有请在该讨论中跟进。**

      根据 [CONTRIBUTING.md](../../CONTRIBUTING.md) 的 RFC 门槛，满足以下任一条件时应先开 RFC：

      - 架构变更
      - 公共 API / 配置语义 / 部署模型变更
      - 性能关键数据路径改动
      - 新增外部依赖 / 服务 / 协议
      - 跨子系统修改
      - 预计超过约 500 行非测试代码

      RFC 应说明：背景、目标、非目标、方案、兼容性、测试计划、替代方案。

- type: textarea
  attributes:
    label: 背景/动机
    description: 描述当前现状、要解决的问题、以及提出本 RFC 的动机。
  validations:
    required: true

- type: textarea
  attributes:
    label: 目标
    description: 本 RFC 期望达成的目标。
  validations:
    required: true

- type: textarea
  attributes:
    label: 非目标
    description: 明确本 RFC 不打算解决的问题，以划定范围、管理预期。
  validations:
    required: false

- type: textarea
  attributes:
    label: 方案设计
    description: 详细描述技术方案、架构、数据流、关键接口等。可附流程图/架构图。
  validations:
    required: true

- type: textarea
  attributes:
    label: 兼容性影响
    description: >
      说明对以下方面的影响：公共 API（ubsio_kvc.h / bio_c.h）、配置语义（ubsio.conf）、
      部署模型（standalone / 有盘无盘）、持久化格式（BDM 元数据）、ABI、新增依赖。
  validations:
    required: true

- type: textarea
  attributes:
    label: 测试计划
    description: 如何验证该方案：单元测试、集成测试、性能基线、回归等。
  validations:
    required: true

- type: textarea
  attributes:
    label: 替代方案
    description: 考虑过的其他方案及为何未采用。

- type: markdown
  attributes:
    value: >
      欢迎加入社区，感谢您对社区的贡献 🎉!
