name: UBS-IO_平台门禁

on:
  pull_request_target:
    types:
      - open
      - reopen
      - update
    branches: ['*']

  pull_request_comment:
    types: [created]
    comments: ['^/retest$']
    branches: ['*']

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
  SOURCE_REPO: ${{ atomgit.event.pull_request.head.repo.full_name }}
  SOURCE_REF: ${{ atomgit.event.pull_request.head.ref }}
  REPO_FULL_NAME: ${{ atomgit.event.repository.full_name }}
  PR_AUTHOR: ${{ atomgit.event.pull_request.user.login }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: write
  issue: read
  id-token: write
  note: none
  project: none

jobs:
  gate_start:
    name: gate-start
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Post running comment
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo="${ATOMGIT_REPOSITORY:-${REPO_FULL_NAME}}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com/api}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_v5="${api_root}/v5"
          server_url="${ATOMGIT_SERVER_URL:-https://gitcode.com}"

          actions_url="${server_url}/${repo}/actions"

          body="门禁正在运行，您可以通过以下链接查看实时门禁检查结果。
          若您对门禁结果含义不清晰或者遇到问题不知如何解决，可参考门禁指导手册。
          门禁入口及编码规范检查: <a href=\"${actions_url}\">${actions_url}</a>"

          payload="$(jq -n --arg body "${body}" '{body: $body}')"
          comment_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/comments"

          if ! curl -fsSL \
            -X POST \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${comment_url}" \
            >/dev/null 2>&1; then
            curl -fsSL \
              -X POST \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${comment_url}" \
              >/dev/null
          fi

  check_code:
    name: check_code
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Run CodeCheck
        uses: codecheck_gitcode_v2
        with:
          repo_url: 'https://gitcode.com/${{ env.SOURCE_REPO }}.git'
          branch: ${{ env.SOURCE_REF }}
          rule_sets: '[{"language":"C"},{"language":"C++"},{"language":"SHELL"},{"language":"PYTHON"}]'
          access_token: ${{ secrets.CODE_CHECK_TOKEN }}

  check_package_license:
    name: check_package_license
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Check project-level Copyright declaration
        run: |
          set -euo pipefail

          if find . -maxdepth 1 -type f -iname 'copyright' | grep -q .; then
            echo "项目级 Copyright 声明文件存在。"
            echo "check_package_license=SUCCESS" >> "${ATOMGIT_STEP_SUMMARY}"
          else
            echo "仓库copyright检查未通过: 缺少项目级Copyright声明文件"
            echo "check_package_license=WARNING" >> "${ATOMGIT_STEP_SUMMARY}"
          fi

  check_sca:
    name: check_sca
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Run OpenLibing SCA
        uses: openlibing/sca-action/sca-pr-action@v1.0.1
        with:
          project-name: ubs-io
          platform-domain: https://gitcode.com

  check_issue_associate:
    name: check_issue_associate
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Check associated issue
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo="${ATOMGIT_REPOSITORY:-${REPO_FULL_NAME}}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com/api}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_v5="${api_root}/v5"

          issues_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/issues"

          if ! issues_json="$(curl -fsSL \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            "${issues_url}" 2>/dev/null)"; then
            issues_json="$(curl -fsSL \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              "${issues_url}")"
          fi

          issue_count="$(jq 'length' <<<"${issues_json}")"
          echo "PR #${PR_ID} 关联 Issue 数量: ${issue_count}"

          if [[ "${issue_count}" -lt 1 ]]; then
            echo "PR 未关联任何 Issue。"
            exit 1
          fi

  check_docs:
    name: check_docs
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Prepare tools
        run: |
          set -euxo pipefail
          sudo yum install -y curl jq wget
          command -v npm >/dev/null 2>&1 || sudo yum install -y nodejs npm

      - name: Run docs gate
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          repo="${ATOMGIT_REPOSITORY:-${REPO_FULL_NAME}}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com/api}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_v5="${api_root}/v5"
          server_url="${ATOMGIT_SERVER_URL:-https://gitcode.com}"

          comment_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/comments"

          post_comment() {
            local body="$1"
            local payload
            payload="$(jq -n --arg body "${body}" '{body: $body}')"

            if ! curl -fsSL \
              -X POST \
              -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${comment_url}" \
              >/dev/null 2>&1; then
              curl -fsSL \
                -X POST \
                -H "Authorization: token ${ATOMGIT_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${payload}" \
                "${comment_url}" \
                >/dev/null
            fi
          }

          files_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/files?per_page=100"

          if ! files_json="$(curl -fsSL \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            "${files_url}" 2>/dev/null)"; then
            files_json="$(curl -fsSL \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              "${files_url}")"
          fi

          docs_count="$(
            jq '[.[] | select(.filename | test("^docs/.*\\.md$"))] | length' \
              <<<"${files_json}"
          )"

          if [[ "${docs_count}" -eq 0 ]]; then
            post_comment "✅ 跳过 docs ci 检查，没有需要检查的文档文件"
            exit 0
          fi

          repo_root="$(git rev-parse --show-toplevel)"
          work_dir="$(mktemp -d)"

          cd "${work_dir}"
          wget -q https://raw.gitcode.com/openeuler/docs-website/raw/ci/docs-ci-v2.js
          wget -q https://raw.gitcode.com/openeuler/docs-website/raw/ci/package.json
          wget -q https://raw.gitcode.com/openeuler/docs-website/raw/ci/.npmrc

          npm install --silent

          set +e
          node docs-ci-v2.js \
            --repoPath="${repo_root}" \
            --targetOwnerRepo="${repo}" \
            --targetOwnerName="${repo}" \
            --targetBranch="${TARGET_BRANCH}" \
            --detailUrl="${server_url}/${repo}/actions" \
            --outputCount="20" \
            --ciConfigUrl="https://raw.gitcode.com/openeuler/docs/raw/stable-common/.doctools/config.json"
          docs_rc=$?
          set -e

          if [[ -f output.md ]]; then
            docs_output="$(cat output.md)"
          else
            docs_output="❌ 文档门禁运行失败！"
          fi

          post_comment "${docs_output}"

          if [[ "${docs_rc}" -ne 0 ]] || grep -q '^❌' <<<"${docs_output}"; then
            exit 1
          fi

  gate_report:
    name: gate-report
    if: ${{ always() }}
    needs:
      - check_code
      - check_package_license
      - check_sca
      - check_issue_associate
      - check_docs

    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Collect results and post PR comment
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo="${ATOMGIT_REPOSITORY:-${REPO_FULL_NAME}}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com/api}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_v5="${api_root}/v5"
          api_v8="${api_root}/v8"
          server_url="${ATOMGIT_SERVER_URL:-https://gitcode.com}"

          api_get() {
            local url="$1"
            local response

            if response="$(curl -fsSL \
              -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
              "${url}" 2>/dev/null)"; then
              printf '%s' "${response}"
              return 0
            fi

            curl -fsSL \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              "${url}"
          }

          post_comment() {
            local body="$1"
            local payload

            payload="$(jq -n --arg body "${body}" '{body: $body}')"
            local comment_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/comments"

            if ! curl -fsSL \
              -X POST \
              -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${comment_url}" \
              >/dev/null 2>&1; then
              curl -fsSL \
                -X POST \
                -H "Authorization: token ${ATOMGIT_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${payload}" \
                "${comment_url}" \
                >/dev/null
            fi
          }

          status_of() {
            local jobs_json="$1"
            local job_name="$2"

            jq -r \
              --arg name "${job_name}" \
              '
                [
                  .jobs[]?
                  | select(.name == $name or .identifier == $name)
                  | .status
                ]
                | last // "NOT_FOUND"
              ' <<<"${jobs_json}"
          }

          normalize_status() {
            case "${1:-NOT_FOUND}" in
              COMPLETED)
                printf 'SUCCESS'
                ;;
              *)
                printf 'FAILED'
                ;;
            esac
          }

          status_html() {
            case "${1}" in
              SUCCESS)
                printf '&#9989;<strong>SUCCESS</strong>'
                ;;
              WARNING)
                printf '&#9888;<strong>WARNING</strong>'
                ;;
              *)
                printf '&#10060;<strong>FAILED</strong>'
                ;;
            esac
          }

          own_run_id="${ATOMGIT_RUN_ID}"
          own_run_json="$(api_get "${api_v8}/repos/${repo}/actions/runs/${own_run_id}")"
          since="$(jq -r '(.start_time // 0) - 10000' <<<"${own_run_json}")"

          build_run_id=""
          build_run_status="NOT_FOUND"

          for _ in $(seq 1 120); do
            runs_json="$(api_get "${api_v8}/repos/${repo}/actions/runs?per_page=100")"

            build_run_id="$(
              jq -r \
                --arg pr "${PR_ID}" \
                --argjson since "${since}" \
                '
                  [
                    .workflow_runs[]?
                    | select((.pull_request_id | tostring) == $pr)
                    | select(.file_path == ".gitcode/workflows/pr-ci.yml")
                    | select((.start_time // 0) >= $since)
                  ]
                  | sort_by(.start_time)
                  | last
                  | .workflow_run_id // empty
                ' <<<"${runs_json}"
            )"

            if [[ -n "${build_run_id}" ]]; then
              build_run_json="$(api_get "${api_v8}/repos/${repo}/actions/runs/${build_run_id}")"
              build_run_status="$(jq -r '.status // "NOT_FOUND"' <<<"${build_run_json}")"

              case "${build_run_status}" in
                COMPLETED|FAILED|CANCELLED|TIMED_OUT)
                  break
                  ;;
              esac
            fi

            sleep 15
          done

          platform_jobs_json="$(api_get "${api_v8}/repos/${repo}/actions/runs/${own_run_id}/jobs?per_page=100")"

          if [[ -n "${build_run_id}" ]]; then
            build_jobs_json="$(api_get "${api_v8}/repos/${repo}/actions/runs/${build_run_id}/jobs?per_page=100")"
          else
            build_jobs_json='{"jobs":[]}'
          fi

          check_code_status="$(normalize_status "$(status_of "${platform_jobs_json}" "check_code")")"
          check_sca_status="$(normalize_status "$(status_of "${platform_jobs_json}" "check_sca")")"
          issue_status="$(normalize_status "$(status_of "${platform_jobs_json}" "check_issue_associate")")"
          docs_status="$(normalize_status "$(status_of "${platform_jobs_json}" "check_docs")")"
          package_job_status="$(normalize_status "$(status_of "${platform_jobs_json}" "check_package_license")")"

          x86_status="$(normalize_status "$(status_of "${build_jobs_json}" "build-x86_64")")"
          arm_status="$(normalize_status "$(status_of "${build_jobs_json}" "build-aarch64")")"
          precommit_status="$(normalize_status "$(status_of "${build_jobs_json}" "pre-commit")")"
          dt_status="$(normalize_status "$(status_of "${build_jobs_json}" "DT")")"

          if [[ "${package_job_status}" != "SUCCESS" ]]; then
            package_license_status="FAILED"
          else
            package_license_status="WARNING"
          fi

          overall_failed=0

          for status in \
            "${check_code_status}" \
            "${check_sca_status}" \
            "${issue_status}" \
            "${docs_status}" \
            "${x86_status}" \
            "${arm_status}" \
            "${precommit_status}" \
            "${dt_status}"; do
            if [[ "${status}" != "SUCCESS" ]]; then
              overall_failed=1
            fi
          done

          if [[ "${package_license_status}" == "FAILED" ]]; then
            overall_failed=1
          fi

          if [[ "${build_run_status}" != "COMPLETED" ]]; then
            overall_failed=1
          fi

          actions_url="${server_url}/${repo}/actions"

          body="<table>
          <tr><th colspan=2>Check Name</th><th>Build Result</th><th>详情</th><th>Build Details</th></tr>
          <tr><td colspan=2>check_code</td><td>$(status_html "${check_code_status}")</td><td></td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>check_package_license</td><td>$(status_html "${package_license_status}")</td><td>&#8226; 仓库copyright检查未通过: 缺少项目级Copyright声明文件</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>check_sca</td><td>$(status_html "${check_sca_status}")</td><td></td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>x86_64</td><td>$(status_html "${x86_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>aarch64</td><td>$(status_html "${arm_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>pre-commit</td><td>$(status_html "${precommit_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>DT</td><td>$(status_html "${dt_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>check_issue_associate</td><td>$(status_html "${issue_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          </table>"

          post_comment "${body}"

          author_body="[@${PR_AUTHOR}](https://gitcode.com/${PR_AUTHOR})"
          post_comment "${author_body}"

          if [[ "${overall_failed}" -ne 0 ]]; then
            echo "门禁检查失败。"
            exit 1
          fi

          echo "全部门禁检查通过。"