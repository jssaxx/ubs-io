      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: ci-result-aarch64
          path: .ci-results/aarch64

  dt:
    name: DT
    runs-on: [self-hosted, openeuler, arm, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo yum install -y \
            python3 \
            python3-pip \
            python3-devel \
            pybind11-devel \
            gcc \
            gcc-c++ \
            make \
            cmake \
            maven \
            hostname \
            fuse-devel \
            automake \
            librados-devel \
            libaio-devel \
            libtool \
            numactl-devel \
            libcurl-devel \
            libboundscheck \
            rdma-core-devel \
            openssl \
            openssl-devel \
            dos2unix \
            liburing \
            liburing-devel

      - name: Run UBSIO-BoostIO DT
        run: |
          set -euxo pipefail
          cd ubsio-boostio/test/llt
          bash run_dt.sh

      - name: Upload DT reports
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: ubsio-boostio-dt
          path: |
            ubsio-boostio/coverage_report/
            ubsio-boostio/coverage_report/report.xml
            ubsio-boostio/coverage_report/coverage.info

      - name: Save result
