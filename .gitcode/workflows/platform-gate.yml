name: HAM_平台门禁

on:
  pull_request_target:
    types:
      - open
      - reopen
      - update
    branches:
      - master

  pull_request_comment:
    types: [created]
    comments: ['^\s*/retest\s*$']
    branches:
      - master

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
  SOURCE_REPO: ${{ atomgit.event.pull_request.head.repo.full_name }}
  SOURCE_REF: ${{ atomgit.event.pull_request.head.ref }}
  REPO_FULL_NAME: ${{ atomgit.event.repository.full_name }}
  PR_AUTHOR: ${{ atomgit.event.pull_request.user.login }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  action: read
  pr: write
  issue: write
  id-token: write
  note: write
  project: none

jobs:
  gate_start:
    name: gate-start
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Post running comment
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo_url="${ATOMGIT_REPOSITORY_URL:-https://gitcode.com/ComputingActionTest/ham_7628.git}"
          repo="${repo_url#https://gitcode.com/}"
          repo="${repo%.git}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_root="${api_root%/api}"
          api_v5="${api_root}/api/v5"
          server_url="${ATOMGIT_SERVER_URL:-https://gitcode.com}"

          actions_url="${server_url}/${repo}/actions"

          body="门禁正在运行，您可以通过以下链接查看实时门禁检查结果。
          若您对门禁结果含义不清晰或者遇到问题不知如何解决，可参考门禁指导手册。
          门禁入口及编码规范检查: <a href=\"${actions_url}\">${actions_url}</a>"

          payload="$(jq -n --arg body "${body}" '{body: $body}')"
          comment_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/comments"

          if ! curl -fsSL \
            -X POST \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${comment_url}" \
            >/dev/null 2>&1; then
            curl -fsSL \
              -X POST \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${comment_url}" \
              >/dev/null
          fi

  check_package_license:
    name: check_package_license
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Check project-level Copyright declaration
        run: |
          set -euo pipefail

          mkdir -p .gate-results

          if find . -maxdepth 1 -type f -iname 'copyright' | grep -q .; then
            echo "项目级 Copyright 声明文件存在。"
            echo "SUCCESS" > .gate-results/check_package_license
            echo "check_package_license=SUCCESS" >> "${ATOMGIT_STEP_SUMMARY}"
          else
            echo "仓库copyright检查未通过: 缺少项目级Copyright声明文件"
            echo "WARNING" > .gate-results/check_package_license
            echo "check_package_license=WARNING" >> "${ATOMGIT_STEP_SUMMARY}"
          fi

      - name: Save failed result
        if: ${{ failure() }}
        run: |
          mkdir -p .gate-results
          echo "FAILED" > .gate-results/check_package_license

      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: gate-result-package-license
          path: .gate-results/check_package_license

  check_sca:
    name: check_sca
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Run OpenLibing SCA
        uses: openlibing/sca-action/sca-pr-action@v1.0.1
        with:
          project-name: ham
          platform-domain: https://gitcode.com

      - name: Save result
        if: ${{ always() }}
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .gate-results
          if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
            echo "SUCCESS" > .gate-results/check_sca
          else
            echo "FAILED" > .gate-results/check_sca
          fi

      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: gate-result-sca
          path: .gate-results/check_sca

  check_issue_associate:
    name: check_issue_associate
    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Check associated issue
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo_url="${ATOMGIT_REPOSITORY_URL:-https://gitcode.com/ComputingActionTest/ham_7628.git}"
          repo="${repo_url#https://gitcode.com/}"
          repo="${repo%.git}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_root="${api_root%/api}"
          api_v5="${api_root}/api/v5"

          issues_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/issues"

          if ! issues_json="$(curl -fsSL \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            "${issues_url}" 2>/dev/null)"; then
            issues_json="$(curl -fsSL \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              "${issues_url}")"
          fi

          issue_count="$(jq 'length' <<<"${issues_json}")"
          echo "PR #${PR_ID} 关联 Issue 数量: ${issue_count}"

          if [[ "${issue_count}" -lt 1 ]]; then
            echo "PR 未关联任何 Issue。"
            exit 1
          fi

      - name: Save result
        if: ${{ always() }}
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .gate-results
          if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
            echo "SUCCESS" > .gate-results/check_issue_associate
          else
            echo "FAILED" > .gate-results/check_issue_associate
          fi

      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: gate-result-issue-associate
          path: .gate-results/check_issue_associate

  gate_report:
    name: gate-report
    if: ${{ always() }}
    needs:
      - check_package_license
      - check_sca
      - check_issue_associate

    runs-on: [self-hosted, openeuler, arm, cpu=8]

    steps:
      - name: Download package result
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: gate-result-package-license
          path: .gate-results/package

      - name: Download SCA result
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: gate-result-sca
          path: .gate-results/sca

      - name: Download issue result
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: gate-result-issue-associate
          path: .gate-results/issue

      - name: Collect results and post PR comment
        if: ${{ always() }}
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
          GATE_STATUS_TOKEN: ${{ secrets.CODE_CHECK_TOKEN }}
        run: |
          set -euo pipefail

          sudo yum install -y curl jq

          repo_url="${ATOMGIT_REPOSITORY_URL:-https://gitcode.com/ComputingActionTest/ham_7628.git}"
          repo="${repo_url#https://gitcode.com/}"
          repo="${repo%.git}"
          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_root="${api_root%/api}"
          api_v5="${api_root}/api/v5"
          api_v8="${api_root}/api/v8"
          server_url="${ATOMGIT_SERVER_URL:-https://gitcode.com}"

          status_token="${GATE_STATUS_TOKEN:-${ATOMGIT_TOKEN}}"

          api_get() {
            local url="$1"
            local response

            if response="$(curl -fsSL \
              -H "PRIVATE-TOKEN: ${status_token}" \
              "${url}" 2>/dev/null)"; then
              printf '%s' "${response}"
              return 0
            fi

            curl -fsSL \
              -H "Authorization: token ${status_token}" \
              "${url}"
          }

          post_comment() {
            local body="$1"
            local payload
            payload="$(jq -n --arg body "${body}" '{body: $body}')"
            local comment_url="${api_v5}/repos/${repo}/pulls/${PR_ID}/comments"

            if ! curl -fsSL \
              -X POST \
              -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${comment_url}" \
              >/dev/null 2>&1; then
              curl -fsSL \
                -X POST \
                -H "Authorization: token ${ATOMGIT_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${payload}" \
                "${comment_url}" \
                >/dev/null
            fi
          }

          read_result() {
            local file="$1"

            if [[ -f "${file}" ]]; then
              tr -d '[:space:]' < "${file}"
            else
              printf 'FAILED'
            fi
          }

          status_html() {
            case "${1}" in
              SUCCESS)
                printf '&#9989;<strong>SUCCESS</strong>'
                ;;
              WARNING)
                printf '&#9888;<strong>WARNING</strong>'
                ;;
              *)
                printf '&#10060;<strong>FAILED</strong>'
                ;;
            esac
          }

          check_sca_status="$(
            read_result ".gate-results/sca/check_sca"
          )"

          issue_status="$(
            read_result ".gate-results/issue/check_issue_associate"
          )"

          package_license_status="$(
            read_result ".gate-results/package/check_package_license"
          )"

          now_ms="$(date +%s%3N)"
          runs_json=""

          if ! runs_json="$(
            api_get "${api_v8}/repos/${repo}/actions/runs?per_page=100"
          )"; then
            echo "WARNING: Unable to query Actions runs."
            runs_json='{"workflow_runs":[]}'
          fi

          platform_run_id="${ATOMGIT_RUN_ID:-}"

          if [[ -z "${platform_run_id}" ]]; then
            platform_run_id="$(
              jq -r \
                --arg pr "${PR_ID}" \
                --argjson now "${now_ms}" \
                '
                  [
                    .workflow_runs[]?
                    | select((.pull_request_id | tostring) == $pr)
                    | select(.file_path == ".gitcode/workflows/platform-gate.yml")
                    | select((.start_time // 0) <= $now)
                  ]
                  | sort_by(.start_time)
                  | last
                  | .workflow_run_id // empty
                ' <<<"${runs_json}"
            )"
          fi

          if [[ -z "${platform_run_id}" ]]; then
            echo "Unable to find current platform run"
            exit 1
          fi

          platform_start="${now_ms}"

          if platform_run_json="$(
            api_get "${api_v8}/repos/${repo}/actions/runs/${platform_run_id}" \
              2>/dev/null
          )"; then
            parsed_start="$(
              jq -r '.start_time // 0' <<<"${platform_run_json}"
            )"

            if [[ "${parsed_start}" -gt 0 ]]; then
              platform_start="${parsed_start}"
            fi
          fi

          build_run_id=""
          build_run_status="NOT_FOUND"

          for _ in $(seq 1 120); do
            if ! runs_json="$(
              api_get "${api_v8}/repos/${repo}/actions/runs?per_page=100"
            )"; then
              runs_json='{"workflow_runs":[]}'
            fi

            build_run_id="$(
              jq -r \
                --arg pr "${PR_ID}" \
                --arg head "${HEAD_SHA}" \
                --argjson platform_start "${platform_start}" \
                '
                  [
                    .workflow_runs[]?
                    | select((.pull_request_id | tostring) == $pr)
                    | select(.file_path == ".gitcode/workflows/pr-ci.yml")
                    | select((.head_sha // "") == $head)
                    | . as $run
                    | (($run.start_time // 0) - $platform_start) as $delta
                    | select(
                        (($delta | if . < 0 then -. else . end) <= 600000)
                      )
                    | $run
                    | . + {
                        distance_ms: (
                          $delta | if . < 0 then -. else . end
                        )
                      }
                  ]
                  | sort_by(.distance_ms)
                  | first
                  | .workflow_run_id // empty
                ' <<<"${runs_json}"
            )"

            if [[ -n "${build_run_id}" ]]; then
              build_run_json="$(
                api_get "${api_v8}/repos/${repo}/actions/runs/${build_run_id}"
              )"

              build_run_status="$(
                jq -r '.status // "NOT_FOUND"' <<<"${build_run_json}"
              )"

              echo "Matched CI run: ${build_run_id}"
              echo "CI run status: ${build_run_status}"

              case "${build_run_status}" in
                COMPLETED|SUCCESS|FAILED|CANCELLED|TIMED_OUT)
                  break
                  ;;
              esac
            fi

            sleep 15
          done

          echo "platform_start=${platform_start}"
          echo "build_run_id=${build_run_id}"
          echo "build_run_status=${build_run_status}"

          if [[ "${build_run_status}" == "COMPLETED" || "${build_run_status}" == "SUCCESS" ]]; then
            x86_status="SUCCESS"
            arm_status="SUCCESS"
            precommit_status="SUCCESS"
            dt_status="SUCCESS"
          else
            x86_status="FAILED"
            arm_status="FAILED"
            precommit_status="FAILED"
            dt_status="FAILED"
          fi

          overall_failed=0

          for status in \
            "${check_sca_status}" \
            "${issue_status}" \
            "${x86_status}" \
            "${arm_status}" \
            "${precommit_status}" \
            "${dt_status}"; do
            if [[ "${status}" != "SUCCESS" ]]; then
              overall_failed=1
            fi
          done

          if [[ "${package_license_status}" == "FAILED" ]]; then
            overall_failed=1
          fi

          actions_url="${server_url}/${repo}/actions"

          if [[ "${package_license_status}" == "SUCCESS" ]]; then
            package_detail="项目级Copyright声明文件存在"
          else
            package_detail="仓库copyright检查未通过: 缺少项目级Copyright声明文件"
          fi

          body="<table>
          <tr><th colspan=2>Check Name</th><th>Build Result</th><th>详情</th><th>Build Details</th></tr>
          <tr><td colspan=2>check_package_license</td><td>$(status_html "${package_license_status}")</td><td>${package_detail}</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>check_sca</td><td>$(status_html "${check_sca_status}")</td><td></td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>x86_64</td><td>$(status_html "${x86_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>aarch64</td><td>$(status_html "${arm_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>pre-commit</td><td>$(status_html "${precommit_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>DT</td><td>$(status_html "${dt_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          <tr><td colspan=2>check_issue_associate</td><td>$(status_html "${issue_status}")</td><td>check_build</td><td><a href=\"${actions_url}\">查看</a></td></tr>
          </table>"

          post_comment "${body}"

          author_body="[@${PR_AUTHOR}](https://gitcode.com/${PR_AUTHOR})"
          post_comment "${author_body}"

          if [[ "${overall_failed}" -ne 0 ]]; then
            echo "门禁检查失败。"
            exit 1
          fi

          echo "全部门禁检查通过。"