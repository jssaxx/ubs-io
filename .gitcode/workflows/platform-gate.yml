name: UBS-IO_CI

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ['*']

  pull_request_comment:
    types: [created]
    comments: ['^/retest$']
    branches: ['*']

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: none
  issue: none
  note: none
  project: none

jobs:
  pre_commit:
    name: pre-commit
    runs-on: [self-hosted, openeuler, arm, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Install pre-commit
        run: |
          set -euxo pipefail

          sudo yum install -y python3 python3-pip

          sudo python3 -m pip install \
            --index-url https://repo.huaweicloud.com/repository/pypi/simple \
            --trusted-host repo.huaweicloud.com \
            --timeout 120 \
            --retries 5 \
            "pre-commit==4.3.0" \
            "clang-format==12.0.1"

          clang-format --version

      - name: Run clang-format
        run: |
          set -euxo pipefail
          sed -i 's/, -i/, -n, --Werror/g' .pre-commit-config.yaml
          pre-commit run clang-format --all-files

      - name: Save result
        if: ${{ always() }}
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
            echo "SUCCESS" > .ci-results/pre-commit
          else
            echo "FAILED" > .ci-results/pre-commit
          fi

      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: ci-result-pre-commit
          path: .ci-results/pre-commit

  build_x86_64:
    name: build-x86_64
    runs-on: [self-hosted, openeuler, x86, cpu=16]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest

    steps:
      - name: Checkout PR merge code
        uses: checkout
        with:
          ref: refs/merge-requests/${{ env.PR_ID }}/merge

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo yum install -y \
            python3 \
            python3-pip \
            python3-devel \
            pybind11-devel \
            gcc \
            gcc-c++ \
            make \
            cmake \
            maven \
            hostname \
            fuse-devel \
            automake \
            librados-devel \
            libaio-devel \
            libtool \
            numactl-devel \
            libcurl-devel \
            libboundscheck \
            rdma-core-devel \
            openssl \
            openssl-devel \
            dos2unix \
            liburing \
            liburing-devel

          sudo python3 -m pip config set global.index-url \
            https://repo.huaweicloud.com/repository/pypi/simple
          sudo python3 -m pip config set global.timeout 120

          sudo python3 -m pip install wheel pybind11 \
            -i https://repo.huaweicloud.com/repository/pypi/simple \
            --trusted-host repo.huaweicloud.com \
            --timeout 120

      - name: Build UBSIO-BoostIO release
        run: |
          set -euxo pipefail
          cd ubsio-boostio
          bash build.sh -t release

      - name: Upload release package
        uses: upload-artifact
        with:
          name: ubsio-boostio-release-x86_64
          path: ubsio-boostio/BoostIO_*.tar.gz

      - name: Save result
        if: ${{ always() }}
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
            echo "SUCCESS" > .ci-results/x86_64
          else
            echo "FAILED" > .ci-results/x86_64
          fi

      - name: Upload result
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: ci-result-x86-64
          path: .ci-results/x86_64

  build_aarch64:
