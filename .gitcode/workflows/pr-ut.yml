name: ubs-io_UT

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches:
      - master
      - develop
  pull_request_comment:
    types: [created]
    comments: ['^reut$']
    branches:
      - master

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: write

stages:
  ut_stage:
    name: UT
    jobs:
      ubs-io_ut:
        name: ubs-io_ut
        runs-on: [self-hosted, openeuler, arm, cpu=32]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest
        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.PR_ID }}/merge

          - name: Show environment
            run: |
              set -euxo pipefail
              whoami
              uname -a
              cat /etc/os-release
              echo "PR_ID=${PR_ID}"
              echo "TARGET_BRANCH=${TARGET_BRANCH:-}"
              echo "ATOMGIT_WORKSPACE=${ATOMGIT_WORKSPACE}"
              pwd
              ls -al

          - name: Install dependencies
            run: |
              set -euxo pipefail

              sudo yum install -y \
                python3 \
                python3-pip \
                python3-devel \
                pybind11-devel \
                gcc \
                gcc-c++ \
                make \
                cmake \
                maven \
                hostname \
                fuse-devel \
                automake \
                librados-devel \
                libaio-devel \
                libtool \
                numactl-devel \
                libcurl-devel \
                libboundscheck \
                rdma-core-devel \
                openssl \
                openssl-devel \
                dos2unix \
                liburing \
                liburing-devel \
                lcov

              sudo python3 -m pip config set global.index-url \
                https://repo.huaweicloud.com/repository/pypi/simple
              sudo python3 -m pip config set global.timeout 120

              sudo python3 -m pip install wheel \
                -i https://repo.huaweicloud.com/repository/pypi/simple \
                --trusted-host repo.huaweicloud.com \
                --timeout 120

              sudo python3 -m pip install pybind11 \
                -i https://repo.huaweicloud.com/repository/pypi/simple \
                --trusted-host repo.huaweicloud.com \
                --timeout 120

              find /usr -name "libssl.so*" || true

          - name: Run DT
            run: |
              set -uo pipefail

              if ! repo_root="$(git rev-parse --show-toplevel 2>/dev/null)"; then
                echo "Current directory is not a Git repository." >&2
                exit 1
              fi

              dt_status=0

              if [[ "${TARGET_BRANCH:-}" == "develop" ]]; then
                echo "Running ubsio-kv DT"
                (
                  cd "${repo_root}/ubsio-kv/test/llt"
                  bash run_dt.sh
                ) || dt_status=$?
              else
                echo "Target branch is ${TARGET_BRANCH:-unknown}; skip ubsio-kv DT"
              fi

              echo "Running ubsio-boostio DT"
              (
                cd "${repo_root}/ubsio-boostio/test/llt"
                bash run_dt.sh
              ) || dt_status=$?

              exit "${dt_status}"
