<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">UBSIO DRAM pool deployment view</title>
  <desc id="desc">The deployment view shows vLLM-Ascend, memcache or Mooncake, DRAM Pool, UBSIO modules, and local NVMe SSD modules across multiple nodes.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669" />
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .node-frame { fill: none; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
      .node-label { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .box { rx: 10; stroke-width: 1.5; }
      .app { fill: #eff6ff; stroke: #2563eb; }
      .pool-band { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.3; rx: 14; }
      .mem { fill: #ecfdf5; stroke: #059669; }
      .ubsio { fill: #fff7ed; stroke: #ea580c; }
      .sub { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.1; rx: 6; }
      .ssd { fill: #ffffff; stroke: #ea580c; }
      .ssd-stack { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.1; rx: 10; }
      .label { font: 700 15px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small-label { font: 700 12px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .tiny-label { font: 700 10.5px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .dots { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #334155; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
      .pool-arrow { stroke: #059669; stroke-width: 2.2; fill: none; marker-end: url(#arrowGreen); }
      .disk-arrow { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="560" />
  <rect class="node-frame" x="30" y="24" width="350" height="512" />
  <rect class="node-frame" x="410" y="24" width="350" height="512" />
  <rect class="node-frame" x="800" y="24" width="350" height="512" />

  <rect class="pool-band" x="52" y="128" width="1076" height="110" />
  <text class="label" x="72" y="159">DRAM Pool</text>
  <text class="dots" x="774" y="364">...</text>

  <text class="node-label center" x="205" y="45">Node0</text>
  <text class="node-label center" x="585" y="45">Node1</text>
  <text class="node-label center" x="975" y="45">NodeX</text>

  <g id="node0">
    <rect class="box app" x="66" y="66" width="278" height="50" />
    <text class="label center" x="205" y="91">vLLM-Ascend</text>

    <rect class="box mem" x="66" y="170" width="278" height="50" />
    <text class="label center" x="205" y="195">memcache / Mooncake</text>

    <rect class="box ubsio" x="66" y="282" width="278" height="154" />
    <text class="small-label center" x="205" y="306">UBSIO</text>
    <rect class="sub" x="92" y="326" width="104" height="34" />
    <text class="tiny-label center" x="144" y="343">ubsio-kv</text>
    <rect class="sub" x="214" y="326" width="104" height="34" />
    <text class="tiny-label center" x="266" y="343">BoostIO SDK</text>
    <rect class="sub" x="92" y="386" width="104" height="34" />
    <text class="tiny-label center" x="144" y="403">Cache / Flow</text>
    <rect class="sub" x="214" y="386" width="104" height="34" />
    <text class="tiny-label center" x="266" y="403">ubsio-bdm</text>

    <rect class="ssd-stack" x="79" y="466" width="252" height="34" />
    <rect class="ssd-stack" x="73" y="476" width="264" height="34" />
    <rect class="box ssd" x="66" y="486" width="278" height="34" />
    <text class="label center" x="205" y="503">Local NVMe SSD</text>

    <path class="arrow" d="M205 116 L205 170" />
    <path class="pool-arrow" d="M205 238 L205 282" />
    <path class="disk-arrow" d="M205 436 L205 486" />
  </g>

  <g id="node1">
    <rect class="box app" x="446" y="66" width="278" height="50" />
    <text class="label center" x="585" y="91">vLLM-Ascend</text>

    <rect class="box mem" x="446" y="170" width="278" height="50" />
    <text class="label center" x="585" y="195">memcache / Mooncake</text>

    <rect class="box ubsio" x="446" y="282" width="278" height="154" />
    <text class="small-label center" x="585" y="306">UBSIO</text>
    <rect class="sub" x="472" y="326" width="104" height="34" />
    <text class="tiny-label center" x="524" y="343">ubsio-kv</text>
    <rect class="sub" x="594" y="326" width="104" height="34" />
    <text class="tiny-label center" x="646" y="343">BoostIO SDK</text>
    <rect class="sub" x="472" y="386" width="104" height="34" />
    <text class="tiny-label center" x="524" y="403">Cache / Flow</text>
    <rect class="sub" x="594" y="386" width="104" height="34" />
    <text class="tiny-label center" x="646" y="403">ubsio-bdm</text>

    <rect class="ssd-stack" x="459" y="466" width="252" height="34" />
    <rect class="ssd-stack" x="453" y="476" width="264" height="34" />
    <rect class="box ssd" x="446" y="486" width="278" height="34" />
    <text class="label center" x="585" y="503">Local NVMe SSD</text>

    <path class="arrow" d="M585 116 L585 170" />
    <path class="pool-arrow" d="M585 238 L585 282" />
    <path class="disk-arrow" d="M585 436 L585 486" />
  </g>

  <g id="nodex">
    <rect class="box app" x="836" y="66" width="278" height="50" />
    <text class="label center" x="975" y="91">vLLM-Ascend</text>

    <rect class="box mem" x="836" y="170" width="278" height="50" />
    <text class="label center" x="975" y="195">memcache / Mooncake</text>

    <rect class="box ubsio" x="836" y="282" width="278" height="154" />
    <text class="small-label center" x="975" y="306">UBSIO</text>
    <rect class="sub" x="862" y="326" width="104" height="34" />
    <text class="tiny-label center" x="914" y="343">ubsio-kv</text>
    <rect class="sub" x="984" y="326" width="104" height="34" />
    <text class="tiny-label center" x="1036" y="343">BoostIO SDK</text>
    <rect class="sub" x="862" y="386" width="104" height="34" />
    <text class="tiny-label center" x="914" y="403">Cache / Flow</text>
    <rect class="sub" x="984" y="386" width="104" height="34" />
    <text class="tiny-label center" x="1036" y="403">ubsio-bdm</text>

    <rect class="ssd-stack" x="849" y="466" width="252" height="34" />
    <rect class="ssd-stack" x="843" y="476" width="264" height="34" />
    <rect class="box ssd" x="836" y="486" width="278" height="34" />
    <text class="label center" x="975" y="503">Local NVMe SSD</text>

    <path class="arrow" d="M975 116 L975 170" />
    <path class="pool-arrow" d="M975 238 L975 282" />
    <path class="disk-arrow" d="M975 436 L975 486" />
  </g>
</svg>
