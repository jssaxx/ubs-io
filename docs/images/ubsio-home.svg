    <path d="M190 532 C364 506 510 492 628 498 L590 538 C462 548 340 548 190 532 Z" fill="url(#trail)" opacity="0.46"/>
    <path d="M1168 536 C1398 624 1714 596 1902 496 C1698 640 1362 648 1156 538 Z" fill="url(#arcBottom)" opacity="0.96"/>
