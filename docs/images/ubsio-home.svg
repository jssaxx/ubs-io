<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="768" viewBox="0 0 2048 768" role="img" aria-labelledby="title desc">
  <title id="title">UBSIO</title>
  <desc id="desc">UBSIO green speed wordmark for the project homepage.</desc>
  <defs>
    <linearGradient id="word" x1="620" y1="214" x2="1760" y2="584" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63d70e"/>
      <stop offset="0.44" stop-color="#15a334"/>
      <stop offset="1" stop-color="#006f3f"/>
    </linearGradient>
    <linearGradient id="trail" x1="86" y1="384" x2="760" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#b7ec37" stop-opacity="0.22"/>
      <stop offset="0.78" stop-color="#6bd11c" stop-opacity="0.58"/>
