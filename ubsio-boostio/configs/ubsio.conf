# BoostIO 配置
[ubsio]

# 设置磁盘或分区路径。不填表示不使用磁盘设备，仅使用ubsio内存。填写方式见配置说明。
ubsio.disk.path =

# ubsio单个进程内存大小，单位GB。例如单节点剩余内存200GB，推理服务启动4卡，可以配置200/4=50GB。
ubsio.mem.size_in_gb = 150
# ubsio内存淘汰水位，无ubsio.disk.path配置时设置为100，有ubsio.disk.path配置时设置为0。
ubsio.wcache.evict_water_level = 0
# ubsio磁盘淘汰水位，示例为90%
ubsio.wcache.disk_evict_water_level = 90

# 启动推理服务的 NPU 卡数。例如推理启动4卡，同时ubsio.disk.path配置了8个分区，配置填4。
ubsio.standalone.device_count = 0
# BDM IO 引擎。可选 sync/io_uring。
ubsio.bdm.io_engine = sync
# io_uring SQPOLL模式。auto表示不支持SQPOLL时继续使用普通io_uring；required表示必须使用；disabled表示直接使用普通io_uring。
ubsio.bdm.io_uring.sqpoll_mode = auto
# sync引擎执行BDM批量阻塞IO的内部线程数。
ubsio.bdm.sync.worker_num = 16
# batchget 走 BDM 读盘时的单窗口 key 数上限。
ubsio.bdm.batch_read.window_keys = 128
# batchget 走 BDM 读盘时的单窗口字节数上限，单位 MB。
ubsio.bdm.batch_read.window_bytes_mb = 64
# batchget 走 BDM 读盘时允许同时在途的窗口数。
ubsio.bdm.batch_read.pipeline_depth = 4
# batchget 走 BDM 读盘时的独立临时缓冲池大小，单位 MB。0 表示不预申请，按需申请。
ubsio.bdm.batch_read.temp_pool_mb = 0
# standalone batchget 走 BDM 读盘时默认先读到 scratch pool，再拷贝到上层 buffer。配置为 false 才允许 BDM 直接写上层 buffer。
ubsio.bdm.batch_read.standalone.use_scratch_pool = true

# 设置日志输出级别。可选`error`、`warn`、`info`、`debug`、`trace`。
ubsio.log.level = info

# 以下配置无需修改
# 将全部内存缓存容量用于写缓存。
ubsio.cache.mem_read_write_ratio = 0:10
# 将全部磁盘缓存容量用于写缓存。
ubsio.cache.disk_read_write_ratio = 0:10
# 设置 UnderFS 后端：本地单机使用 none。需要后端访问时使用 ceph 或 hdfs。
ubsio.underfs.file_system_type = none
# 本地单机运行时禁用 TLS 配置路径校验。
ubsio.net.tls.enable.switch = false
ubsio.sdkmem.size_in_mb = 0
ubsio.cache.qos.enable = false
